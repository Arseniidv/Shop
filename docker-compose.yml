services:
  db:
    image: mysql:8
    container_name: shop_db
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: shop_backend
    ports:
      - "5001:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: shop
      JWT_SECRET: semena-jwt-secret-2026
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    container_name: shop_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always

volumes:
  mysql_data:
